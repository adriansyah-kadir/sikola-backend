[package]
name = "sikola-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.8", features = ["macros"] }
axum-extra = { version = "0.12.3", features = ["typed-header"] }
dotenvy = "0.15.7"
jsonwebtoken = { version = "10.2.0", features = ["rust_crypto"] }
keycloak = { version = "1.0.0", path = "../keycloak-rust" }
sea-orm = { version = "2.0.0-rc", features = [
  "sqlx-postgres",
  "macros",
  "runtime-tokio-native-tls",
  "with-time",
  "with-json",
  "with-uuid",
] }
serde = "1.0.228"
tokio = { version = "1.48.0", features = ["full"] }
tower = "0.5.2"
tower-http = { version = "0.6.8", features = ["trace", "request-id", "cors"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
uuid = { version = "1.19.0", features = ["serde", "v7"] }
